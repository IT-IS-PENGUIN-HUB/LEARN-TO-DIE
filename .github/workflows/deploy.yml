name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Commit "Sync vocab" / "Sync tiến độ đọc" / "Sync đề thi" từ app không cần
    # deploy lại site: cả ba file đều được app đọc/ghi qua GitHub API, không đọc
    # từ bản deploy. Thiếu dòng exam-progress.json thì MỖI 10 GIÂY làm bài lại
    # kích một lần build+deploy, còn cancel ngang deploy code thật đang chạy.
    paths-ignore:
      - 'vocab.json'
      - 'progress.json'
      - 'exam-progress.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
